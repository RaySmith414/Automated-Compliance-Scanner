# Linux check catalog. This file is the single source for check IDs, titles,
# severities, expected state, remediation text and framework mappings.
# The code in scanner/linux_checks.py supplies only the test logic for each
# "function" named here. tests/test_catalog.py fails if the two drift apart.

platform: linux

benchmark:
  family: CIS Benchmarks for Ubuntu Linux
  written_against: Ubuntu 22.04 LTS (also exercised on Ubuntu 24.04 LTS)
  note: >-
    Each check cites the CIS recommendation by title. Recommendation numbers
    change between benchmark versions, so cis_id is empty by default. Fill it in
    as a quoted string (for example "1.1.1.1") from the benchmark version your
    organization has adopted and it will appear in every report.

checks:
  # ------------------------------------------------------------- filesystem
  - id: LNX-FS-001
    function: cramfs_disabled
    title: Ensure mounting of cramfs filesystems is disabled
    category: filesystem
    severity: high
    requires_root: false
    expected: The cramfs kernel module is not loaded and cannot be loaded
    remediation: 'Create /etc/modprobe.d/cramfs.conf containing "install cramfs /bin/false" and "blacklist cramfs", then run "modprobe -r cramfs".'
    cis_id: null
    nist_800_53: [CM-7, CM-6]
    soc2: [CC7.1]
    iso_27001: [A.8.9]

  - id: LNX-FS-002
    function: squashfs_disabled
    title: Ensure mounting of squashfs filesystems is disabled
    category: filesystem
    severity: medium
    requires_root: false
    expected: The squashfs kernel module is not loaded and cannot be loaded
    remediation: 'Create /etc/modprobe.d/squashfs.conf containing "install squashfs /bin/false" and "blacklist squashfs". Do not apply this on hosts that use snap packages.'
    cis_id: null
    nist_800_53: [CM-7, CM-6]
    soc2: [CC7.1]
    iso_27001: [A.8.9]

  - id: LNX-FS-003
    function: udf_disabled
    title: Ensure mounting of udf filesystems is disabled
    category: filesystem
    severity: low
    requires_root: false
    expected: The udf kernel module is not loaded and cannot be loaded
    remediation: 'Create /etc/modprobe.d/udf.conf containing "install udf /bin/false" and "blacklist udf", then run "modprobe -r udf".'
    cis_id: null
    nist_800_53: [CM-7, CM-6]
    soc2: [CC7.1]
    iso_27001: [A.8.9]

  - id: LNX-FS-004
    function: tmp_separate_mount
    title: Ensure /tmp is a separate partition
    category: filesystem
    severity: high
    requires_root: false
    expected: /tmp is its own mount point
    remediation: Mount /tmp as its own file system, for example with the systemd tmp.mount unit or an /etc/fstab entry.
    cis_id: null
    nist_800_53: [CM-6]
    soc2: [CC7.1]
    iso_27001: [A.8.9]

  - id: LNX-FS-005
    function: tmp_noexec
    title: Ensure noexec option set on /tmp partition
    category: filesystem
    severity: high
    requires_root: false
    expected: /tmp is mounted with the noexec option
    remediation: Add noexec to the mount options for /tmp in /etc/fstab or tmp.mount, then remount.
    cis_id: null
    nist_800_53: [CM-7, CM-6]
    soc2: [CC6.8, CC7.1]
    iso_27001: [A.8.9]

  - id: LNX-FS-006
    function: tmp_nodev
    title: Ensure nodev option set on /tmp partition
    category: filesystem
    severity: medium
    requires_root: false
    expected: /tmp is mounted with the nodev option
    remediation: Add nodev to the mount options for /tmp in /etc/fstab or tmp.mount, then remount.
    cis_id: null
    nist_800_53: [CM-6]
    soc2: [CC7.1]
    iso_27001: [A.8.9]

  - id: LNX-FS-007
    function: tmp_nosuid
    title: Ensure nosuid option set on /tmp partition
    category: filesystem
    severity: medium
    requires_root: false
    expected: /tmp is mounted with the nosuid option
    remediation: Add nosuid to the mount options for /tmp in /etc/fstab or tmp.mount, then remount.
    cis_id: null
    nist_800_53: [AC-6, CM-6]
    soc2: [CC6.3, CC7.1]
    iso_27001: [A.8.2, A.8.9]

  # --------------------------------------------------------- authentication
  - id: LNX-AUTH-001
    function: password_max_days
    title: Ensure password expiration is 365 days or less
    category: authentication
    severity: high
    requires_root: false
    expected: PASS_MAX_DAYS in /etc/login.defs is between 1 and 365
    remediation: Set PASS_MAX_DAYS to 365 or less in /etc/login.defs and run "chage --maxdays 365 <user>" for existing accounts.
    cis_id: null
    nist_800_53: [IA-5]
    soc2: [CC6.1]
    iso_27001: [A.5.17]

  - id: LNX-AUTH-002
    function: password_min_days
    title: Ensure minimum days between password changes is configured
    category: authentication
    severity: medium
    requires_root: false
    expected: PASS_MIN_DAYS in /etc/login.defs is 1 or more
    remediation: Set PASS_MIN_DAYS to 1 or more in /etc/login.defs and run "chage --mindays 1 <user>" for existing accounts.
    cis_id: null
    nist_800_53: [IA-5]
    soc2: [CC6.1]
    iso_27001: [A.5.17]

  - id: LNX-AUTH-003
    function: password_warn_age
    title: Ensure password expiration warning days is 7 or more
    category: authentication
    severity: low
    requires_root: false
    expected: PASS_WARN_AGE in /etc/login.defs is 7 or more
    remediation: Set PASS_WARN_AGE to 7 or more in /etc/login.defs.
    cis_id: null
    nist_800_53: [IA-5]
    soc2: [CC6.1]
    iso_27001: [A.5.17]

  - id: LNX-AUTH-004
    function: inactive_password_lock
    title: Ensure inactive password lock is 30 days or less
    category: authentication
    severity: medium
    requires_root: false
    expected: The useradd default INACTIVE is between 0 and 30 days
    remediation: Run "useradd -D -f 30" and "chage --inactive 30 <user>" for existing accounts.
    cis_id: null
    nist_800_53: [AC-2, IA-5]
    soc2: [CC6.2]
    iso_27001: [A.5.18]

  - id: LNX-AUTH-005
    function: root_only_uid0
    title: Ensure root is the only UID 0 account
    category: authentication
    severity: critical
    requires_root: false
    expected: root is the only account with UID 0 in /etc/passwd
    remediation: Remove every other UID 0 account or give it a unique non-zero UID.
    cis_id: null
    nist_800_53: [AC-6, AC-2]
    soc2: [CC6.3]
    iso_27001: [A.8.2]

  - id: LNX-AUTH-006
    function: root_console_restricted
    title: Ensure root login is restricted to system console
    category: authentication
    severity: high
    requires_root: false
    expected: Where pam_securetty is in use, /etc/securetty exists and lists only approved consoles
    remediation: Review /etc/securetty and remove every terminal that is not physically secured.
    cis_id: null
    nist_800_53: [AC-6, IA-2]
    soc2: [CC6.3]
    iso_27001: [A.8.2]

  - id: LNX-AUTH-007
    function: ssh_root_login_disabled
    title: Ensure SSH root login is disabled
    category: authentication
    severity: critical
    requires_root: true
    expected: The effective sshd setting PermitRootLogin is "no"
    remediation: Set "PermitRootLogin no" in /etc/ssh/sshd_config or a drop-in file and reload sshd.
    cis_id: null
    nist_800_53: [AC-17, AC-6, IA-2]
    soc2: [CC6.1, CC6.6]
    iso_27001: [A.8.2, A.8.5]

  - id: LNX-AUTH-008
    function: ssh_empty_passwords_disabled
    title: Ensure SSH PermitEmptyPasswords is disabled
    category: authentication
    severity: critical
    requires_root: true
    expected: The effective sshd setting PermitEmptyPasswords is "no"
    remediation: Set "PermitEmptyPasswords no" in /etc/ssh/sshd_config or a drop-in file and reload sshd.
    cis_id: null
    nist_800_53: [IA-5, AC-17]
    soc2: [CC6.1, CC6.6]
    iso_27001: [A.8.5]

  - id: LNX-AUTH-009
    function: ssh_password_authentication_review
    title: Review SSH PasswordAuthentication against site policy
    category: authentication
    severity: medium
    requires_root: true
    expected: Password logins over SSH are either disabled or documented as an approved exception
    remediation: Set "PasswordAuthentication no" and use keys or certificates, unless site policy documents a need for password logins.
    cis: false
    cis_id: null
    nist_800_53: [IA-2, IA-5, AC-17]
    soc2: [CC6.1, CC6.6]
    iso_27001: [A.8.5]

  - id: LNX-AUTH-010
    function: ssh_max_auth_tries
    title: Ensure SSH MaxAuthTries is set to 4 or less
    category: authentication
    severity: medium
    requires_root: true
    expected: The effective sshd setting MaxAuthTries is 4 or less
    remediation: Set "MaxAuthTries 4" in /etc/ssh/sshd_config or a drop-in file and reload sshd.
    cis_id: null
    nist_800_53: [AC-7]
    soc2: [CC6.1]
    iso_27001: [A.8.5]

  # ---------------------------------------------------------------- network
  - id: LNX-NET-001
    function: ip_forwarding_disabled
    title: Ensure IP forwarding is disabled
    category: network
    severity: high
    requires_root: false
    expected: net.ipv4.ip_forward and net.ipv6.conf.all.forwarding are 0 in the running kernel
    remediation: Set net.ipv4.ip_forward=0 and net.ipv6.conf.all.forwarding=0 in a file under /etc/sysctl.d and run "sysctl --system".
    cis_id: null
    nist_800_53: [SC-7, CM-7, CM-6]
    soc2: [CC6.6]
    iso_27001: [A.8.20, A.8.22]

  - id: LNX-NET-002
    function: send_redirects_disabled
    title: Ensure packet redirect sending is disabled
    category: network
    severity: medium
    requires_root: false
    expected: net.ipv4.conf.all.send_redirects and net.ipv4.conf.default.send_redirects are 0
    remediation: Set both send_redirects keys to 0 in a file under /etc/sysctl.d and run "sysctl --system".
    cis_id: null
    nist_800_53: [SC-7, CM-6]
    soc2: [CC6.6]
    iso_27001: [A.8.20]

  - id: LNX-NET-003
    function: source_route_rejected
    title: Ensure source routed packets are not accepted
    category: network
    severity: medium
    requires_root: false
    expected: accept_source_route is 0 for "all" and "default" on IPv4 and on IPv6 where IPv6 is enabled
    remediation: Set the accept_source_route keys to 0 in a file under /etc/sysctl.d and run "sysctl --system".
    cis_id: null
    nist_800_53: [SC-7, CM-6]
    soc2: [CC6.6]
    iso_27001: [A.8.20]

  - id: LNX-NET-004
    function: icmp_redirects_rejected
    title: Ensure ICMP redirects are not accepted
    category: network
    severity: medium
    requires_root: false
    expected: accept_redirects is 0 for "all" and "default" on IPv4 and on IPv6 where IPv6 is enabled
    remediation: Set the accept_redirects keys to 0 in a file under /etc/sysctl.d and run "sysctl --system".
    cis_id: null
    nist_800_53: [SC-7, CM-6]
    soc2: [CC6.6]
    iso_27001: [A.8.20]

  - id: LNX-NET-005
    function: icmp_broadcast_ignored
    title: Ensure broadcast ICMP requests are ignored
    category: network
    severity: medium
    requires_root: false
    expected: net.ipv4.icmp_echo_ignore_broadcasts is 1
    remediation: Set net.ipv4.icmp_echo_ignore_broadcasts=1 in a file under /etc/sysctl.d and run "sysctl --system".
    cis_id: null
    nist_800_53: [SC-5, CM-6]
    soc2: [CC6.6]
    iso_27001: [A.8.20]

  - id: LNX-NET-006
    function: syn_cookies_enabled
    title: Ensure TCP SYN Cookies is enabled
    category: network
    severity: high
    requires_root: false
    expected: net.ipv4.tcp_syncookies is 1
    remediation: Set net.ipv4.tcp_syncookies=1 in a file under /etc/sysctl.d and run "sysctl --system".
    cis_id: null
    nist_800_53: [SC-5, CM-6]
    soc2: [CC6.6]
    iso_27001: [A.8.20]

  - id: LNX-NET-007
    function: firewall_active
    title: Ensure a host firewall is active
    category: network
    severity: critical
    requires_root: true
    expected: ufw, firewalld, nftables or iptables is active with a filtering rule set
    remediation: 'Enable one host firewall, for example "ufw enable" after allowing the services the host needs.'
    cis_id: null
    nist_800_53: [SC-7, AC-4]
    soc2: [CC6.6]
    iso_27001: [A.8.20, A.8.22]

  # ---------------------------------------------------------------- logging
  - id: LNX-LOG-001
    function: rsyslog_installed
    title: Ensure rsyslog is installed
    category: logging
    severity: high
    requires_root: false
    expected: The rsyslog package is installed
    remediation: Install rsyslog with "apt install rsyslog".
    cis_id: null
    nist_800_53: [AU-12, AU-2]
    soc2: [CC7.2]
    iso_27001: [A.8.15]

  - id: LNX-LOG-002
    function: rsyslog_enabled
    title: Ensure rsyslog service is enabled
    category: logging
    severity: high
    requires_root: false
    expected: The rsyslog unit is enabled
    remediation: Run "systemctl --now enable rsyslog".
    cis_id: null
    nist_800_53: [AU-12]
    soc2: [CC7.2]
    iso_27001: [A.8.15]

  - id: LNX-LOG-003
    function: journald_compress
    title: Ensure journald is configured to compress large log files
    category: logging
    severity: low
    requires_root: false
    expected: Compress=yes is set in the journald configuration
    remediation: Set Compress=yes in /etc/systemd/journald.conf or a drop-in under /etc/systemd/journald.conf.d and restart systemd-journald.
    cis_id: null
    nist_800_53: [AU-4]
    soc2: [CC7.2]
    iso_27001: [A.8.15]

  - id: LNX-LOG-004
    function: journald_persistent
    title: Ensure journald is configured to write logfiles to persistent disk
    category: logging
    severity: medium
    requires_root: false
    expected: Storage=persistent is set in the journald configuration
    remediation: Set Storage=persistent in /etc/systemd/journald.conf or a drop-in under /etc/systemd/journald.conf.d and restart systemd-journald.
    cis_id: null
    nist_800_53: [AU-11, AU-4]
    soc2: [CC7.2]
    iso_27001: [A.8.15]

  - id: LNX-LOG-005
    function: var_log_permissions
    title: Ensure permissions on /var/log are configured
    category: logging
    severity: medium
    requires_root: false
    expected: /var/log is owned by root with group root, adm or syslog and is not writable by others
    remediation: Run "chown root /var/log" and "chmod o-w /var/log".
    cis: false
    cis_id: null
    nist_800_53: [AU-9]
    soc2: [CC7.2, CC6.1]
    iso_27001: [A.8.15, A.8.3]

  # --------------------------------------------------------- access control
  - id: LNX-ACC-001
    function: passwd_permissions
    title: Ensure permissions on /etc/passwd are configured
    category: access_control
    severity: high
    requires_root: false
    expected: /etc/passwd is owned by root:root with mode 0644 or more restrictive
    remediation: Run "chown root:root /etc/passwd" and "chmod u-x,go-wx /etc/passwd".
    cis_id: null
    nist_800_53: [AC-3, AC-6]
    soc2: [CC6.1, CC6.3]
    iso_27001: [A.8.3]

  - id: LNX-ACC-002
    function: shadow_permissions
    title: Ensure permissions on /etc/shadow are configured
    category: access_control
    severity: critical
    requires_root: false
    expected: /etc/shadow is owned by root, group root or shadow, with mode 0640 or more restrictive
    remediation: Run "chown root:shadow /etc/shadow" and "chmod u-x,g-wx,o-rwx /etc/shadow".
    cis_id: null
    nist_800_53: [AC-3, AC-6, IA-5]
    soc2: [CC6.1, CC6.3]
    iso_27001: [A.8.3, A.5.17]

  - id: LNX-ACC-003
    function: group_permissions
    title: Ensure permissions on /etc/group are configured
    category: access_control
    severity: high
    requires_root: false
    expected: /etc/group is owned by root:root with mode 0644 or more restrictive
    remediation: Run "chown root:root /etc/group" and "chmod u-x,go-wx /etc/group".
    cis_id: null
    nist_800_53: [AC-3, AC-6]
    soc2: [CC6.1, CC6.3]
    iso_27001: [A.8.3]

  - id: LNX-ACC-004
    function: no_world_writable_files
    title: Ensure no world writable files exist
    category: access_control
    severity: high
    requires_root: true
    expected: No regular file on a local file system is writable by "other"
    remediation: Review each file and run "chmod o-w <file>" where world write access is not required.
    cis_id: null
    nist_800_53: [AC-3, AC-6]
    soc2: [CC6.1, CC6.3]
    iso_27001: [A.8.3]

  - id: LNX-ACC-005
    function: no_unowned_files
    title: Ensure no unowned or ungrouped files or directories exist
    category: access_control
    severity: medium
    requires_root: true
    expected: Every file and directory on a local file system has a known owner and group
    remediation: Assign each file to a valid account with "chown <user>:<group> <path>" or remove it.
    cis_id: null
    nist_800_53: [AC-3, AC-6]
    soc2: [CC6.1]
    iso_27001: [A.8.3]

  - id: LNX-ACC-006
    function: suid_sgid_review
    title: Review SUID and SGID executables
    category: access_control
    severity: high
    requires_root: true
    expected: Every SUID or SGID executable is known and justified
    remediation: Compare the list with your approved baseline and remove the bit with "chmod u-s,g-s <file>" where it is not needed.
    cis_id: null
    nist_800_53: [AC-6]
    soc2: [CC6.3]
    iso_27001: [A.8.18, A.8.2]

  # --------------------------------------------------------------- services
  - id: LNX-SVC-001
    function: xinetd_not_installed
    title: Ensure xinetd is not installed
    category: services
    severity: medium
    requires_root: false
    expected: The xinetd package is not installed
    remediation: Remove it with "apt purge xinetd".
    cis_id: null
    nist_800_53: [CM-7]
    soc2: [CC7.1]
    iso_27001: [A.8.9]

  - id: LNX-SVC-002
    function: telnet_server_not_installed
    title: Ensure telnet server is not installed
    category: services
    severity: critical
    requires_root: false
    expected: No telnet server package is installed
    remediation: Remove it with "apt purge telnetd inetutils-telnetd" and use SSH.
    cis_id: null
    nist_800_53: [CM-7, SC-8]
    soc2: [CC6.7, CC7.1]
    iso_27001: [A.8.21, A.8.9]

  - id: LNX-SVC-003
    function: ftp_server_not_installed
    title: Ensure FTP server is not installed
    category: services
    severity: high
    requires_root: false
    expected: No FTP server package is installed
    remediation: Remove it with "apt purge vsftpd" and use SFTP.
    cis_id: null
    nist_800_53: [CM-7, SC-8]
    soc2: [CC6.7, CC7.1]
    iso_27001: [A.8.21, A.8.9]

  - id: LNX-SVC-004
    function: http_server_review
    title: Ensure HTTP server is not installed unless required
    category: services
    severity: medium
    requires_root: false
    expected: No web server package is installed unless the host is documented as needing one
    remediation: Remove the web server if this host does not need one, for example "apt purge apache2 nginx".
    cis_id: null
    nist_800_53: [CM-7]
    soc2: [CC7.1]
    iso_27001: [A.8.9]

  - id: LNX-SVC-005
    function: ldap_server_review
    title: Ensure LDAP server is not installed unless required
    category: services
    severity: medium
    requires_root: false
    expected: No LDAP server package is installed unless the host is documented as needing one
    remediation: Remove slapd if this host is not a directory server, with "apt purge slapd".
    cis_id: null
    nist_800_53: [CM-7]
    soc2: [CC7.1]
    iso_27001: [A.8.9]

  - id: LNX-SVC-006
    function: nfs_server_review
    title: Ensure NFS is not installed unless required
    category: services
    severity: medium
    requires_root: false
    expected: No NFS server package is installed unless the host is documented as needing one
    remediation: Remove the NFS server if this host does not export file systems, with "apt purge nfs-kernel-server".
    cis_id: null
    nist_800_53: [CM-7]
    soc2: [CC7.1]
    iso_27001: [A.8.9]
